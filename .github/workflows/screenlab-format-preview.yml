name: Temporary ScreenLab format check (remove before merge)

on:
  push:
    branches:
      - feat/screenlab-visual-tft-editor-20261027

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write frontend/screenlab-core.js frontend/screenlab.js frontend/screenlab.css frontend/bootstrap.js index.html
      - name: Emit formatted source for review
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const names = [
            'frontend/screenlab-core.js',
            'frontend/screenlab.js',
            'frontend/screenlab.css',
            'frontend/bootstrap.js',
            'index.html',
          ];
          for (const path of names) {
            const source = fs.readFileSync(path, 'utf8');
            for (let offset = 0; offset < source.length; offset += 2500) {
              console.log('@@FMT ' + path + ' ' + offset + ' ' + JSON.stringify(source.slice(offset, offset + 2500)));
            }
          }
          NODE
