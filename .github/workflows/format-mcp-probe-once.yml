name: TEMP format probe (feature branch only)
on:
  push:
    branches:
      - feat/optional-maker-mcp-catalog-20261027
    paths:
      - .github/workflows/format-mcp-probe-once.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Show exact Prettier changes without committing
        run: |
          npx prettier --write frontend/agent.js index.html
          git diff -- frontend/agent.js index.html
