name: One-off final ScreenLab color/manifest reconciliation
on:
  push:
    branches: [feat/screenlab-arduino-sketch-pilot-20261027]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write frontend/screenlab-sketch.js tests/test_screenlab_sketch.mjs
      - name: Restore exact Spec Kit hashes and remove temporary workflow
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path("specs/010-screenlab-arduino-sketch/verification.json")
          data=json.loads(path.read_text("utf-8"))
          for filename in data["changed_files"]:
              data["changed_files"][filename]=hashlib.sha256(Path(filename).read_bytes()).hexdigest()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git rm .github/workflows/screenlab-color-fix-once.yml
          git add frontend/screenlab-sketch.js tests/test_screenlab_sketch.mjs docs/SCREENLAB.md specs/010-screenlab-arduino-sketch/verification.json
          python tests/manifest.py --write
          git add MANIFEST_SHA256.txt
          python tests/manifest.py
          python tests/specification_gate.py --base 383ed5791ceaba9eeb386e2261f008b7e10408be --json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(screenlab): seal accurate TFT RGB565 output and Spec Kit 010"
          git push origin HEAD:feat/screenlab-arduino-sketch-pilot-20261027
