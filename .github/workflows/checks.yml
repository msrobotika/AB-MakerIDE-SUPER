name: Comprobaciones

on:
  push:
  pull_request:
  workflow_dispatch:

# Only one CI run per branch/PR; superseded runs are cancelled.
# None of these jobs publishes releases or creates Git tags.
concurrency:
  group: makeride-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Pruebas / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/manifest.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python tests/run_isolated.py
      - run: node --check app.js
      - run: node --check activity.js
      - run: node --check simulator.js
      - run: node --check board_trials.js
      - name: Check POSIX launchers without hardware
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n iniciar_linux_mac.sh preparar_linux_mac.sh
          bash iniciar_linux_mac.sh --check --json --port 48771

  quality:
    name: Ruff, ESLint, Prettier e integridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install ruff==0.17.2
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: python tests/manifest.py

      - name: Spec Kit delivery gate
        env:
          SPECIFICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
        run: python tests/specification_gate.py --base "$SPECIFICATION_BASE" --json

  browser:
    name: Editor y proyectos / Chromium aislado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_agent_consent.py --outputs work/browser-ci
      - run: python tests/browser_simulator.py --outputs work/simulator-ci
      - run: python tests/browser_connection_recovery.py --outputs work/connection-ci
      - run: python tests/browser_auto_identity.py --outputs work/identity-ci
      - run: python tests/browser_clean_start.py --outputs work/start-ci
      - run: python tests/browser_mcp.py --outputs work/mcp-ci
      - run: python tests/browser_security.py --outputs work/security-ci
      - run: python tests/browser_manual_build.py --outputs work/manual-build-ci
