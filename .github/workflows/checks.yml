name: Comprobaciones

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Pruebas / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python tests/run_isolated.py
      - run: node --check app.js
      - run: node --check activity.js
      - run: node --check simulator.js
      - run: node --check board_trials.js

  browser:
    name: Editor y proyectos / Chromium aislado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_agent_consent.py --outputs work/browser-ci
      - run: python tests/browser_simulator.py --outputs work/simulator-ci
      - run: python tests/browser_connection_recovery.py --outputs work/connection-ci
      - run: python tests/browser_auto_identity.py --outputs work/identity-ci
