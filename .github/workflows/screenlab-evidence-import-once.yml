name: ScreenLab screenshot import (one-time; removes itself)
on:
  push:
    branches:
      - fix/screenlab-gallery-spec-kit-20261027
permissions:
  contents: write
jobs:
  import-proven-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deterministic Chromium fixture
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Generate genuine two-profile screenshots and test report
        run: python tests/browser_screenlab.py --outputs work/screenlab-publish
      - name: Import evidence and update Spec Kit closure
        env:
          SOURCE_RUN: "${{ github.run_id }}"
          SOURCE_SHA: "${{ github.sha }}"
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import struct

          origin = Path("work/screenlab-publish")
          dest = Path("docs/evidence/screenlab")
          dest.mkdir(parents=True, exist_ok=True)
          report = json.loads((origin / "report.json").read_text(encoding="utf-8"))
          assert report["checks"] and all(item["passed"] for item in report["checks"]), "Browser checks not green"
          assert not report["page_errors"] and not report["hardware_actions"], "Browser errors/hardware request detected"
          expected_names = ("screenlab-cyd-real.png", "screenlab-ideaspark-real.png")
          hashes = {}
          for name in expected_names:
              path = origin / name
              raw = path.read_bytes()
              assert raw.startswith(bytes.fromhex("89504e470d0a1a0a")), "Invalid PNG"
              width, height = struct.unpack(">II", raw[16:24])
              assert width >= 1200 and height >= 700, "Screenshot not full editor"
              hashes[name] = hashlib.sha256(raw).hexdigest()
              shutil.copyfile(path, dest / name)
          (dest / "report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          run = os.environ["SOURCE_RUN"]
          sha = os.environ["SOURCE_SHA"]
          url = f"https://github.com/msrobotika/AB-MakerIDE-SUPER/actions/runs/{run}"
          dest.joinpath("README.md").write_text(
              "# AB ScreenLab — capturas auténticas de Chromium\n\n"
              "Se generaron automáticamente ejecutando `tests/browser_screenlab.py` "
              "en un navegador Chromium real, durante una ejecución controlada de CI. "
              "**No hay ESP32 conectada; no son fotografías ni capturas del TFT físico.**\n\n"
              f"- Workflow: [{run}]({url}) · commit de origen: `{sha}`.\n"
              "- Pruebas: archivo [report.json](report.json) con 8 verificaciones "
              "y lista de errores/acciones hardware vacías.\n"
              f"- CYD / lienzo 320×240: [captura](screenlab-cyd-real.png), "
              f"SHA256 `{hashes['screenlab-cyd-real.png']}`.\n"
              f"- IdeaSpark / lienzo 240×135: [captura](screenlab-ideaspark-real.png), "
              f"SHA256 `{hashes['screenlab-ideaspark-real.png']}`.\n\n"
              "La salida del generador es una cabecera UI para LVGL 8.x, "
              "no código con BSP/driver/flash acreditado.\n",
              encoding="utf-8",
          )
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "## Empezar en Windows"
          assert marker in text and "## AB ScreenLab" in text
          assert "screenlab-cyd-real.png" not in text
          gallery = (
              "### Capturas reales de AB ScreenLab · rama de desarrollo, no ZIP RC4\n\n"
              "Estas capturas se han generado automáticamente **con Chromium real y placas "
              "simuladas por perfiles de pantalla**, sin una ESP32 conectada. "
              "No son fotografías ni pruebas del firmware físico.\n\n"
              "[![ScreenLab CYD — editor visual de 320×240]"
              "(docs/evidence/screenlab/screenlab-cyd-real.png)]"
              "(docs/evidence/screenlab/screenlab-cyd-real.png)\n\n"
              "[![ScreenLab IdeaSpark — lienzo, propiedades y generador LVGL]"
              "(docs/evidence/screenlab/screenlab-ideaspark-real.png)]"
              "(docs/evidence/screenlab/screenlab-ideaspark-real.png)\n\n"
              "[Procedencia, SHA-256 y reporte de pruebas]"
              "(docs/evidence/screenlab/README.md).\n\n"
          )
          readme.write_text(text.replace(marker, gallery + marker, 1), encoding="utf-8")
          manual = Path("docs/SCREENLAB.md")
          info = manual.read_text(encoding="utf-8")
          assert "## Evidencias visuales" not in info
          info += (
              "\n## Evidencias visuales publicadas\n\n"
              "[Captura CYD 320×240](evidence/screenlab/screenlab-cyd-real.png) · "
              "[Captura IdeaSpark 240×135](evidence/screenlab/screenlab-ideaspark-real.png) · "
              "[Informe, procedencia y hashes](evidence/screenlab/README.md). "
              "Imágenes de Chromium real con placa controlada, no grabación TFT física.\n"
          )
          manual.write_text(info, encoding="utf-8")
          steps = Path("specs/008-screenlab-visual-tft/tasks.md")
          steps.write_text(
              steps.read_text(encoding="utf-8")
              + "- [x] Dos capturas auténticas CYD/IdeaSpark incorporadas a README, "
              "con huellas, report y procedencia CI; sin interpretar navegador como hardware.\n",
              encoding="utf-8",
          )
          checks = Path("specs/008-screenlab-visual-tft/checklists/requirements.md")
          checks.write_text(
              checks.read_text(encoding="utf-8")
              + "- [x] La galería del repositorio enlaza PNG auténticos y el reporte reproducible.\n",
              encoding="utf-8",
          )
          convergence = Path("specs/008-screenlab-visual-tft/convergence.md")
          convergence.write_text(
              "# Convergencia R1 ScreenLab\n"
              "La función de diseño visual e intercambio JSON y el generador LVGL 8.x "
              "están fusionados (PR #15, `dfb7feb278f8170b53bd2f17e198983cd4e05567`). "
              "La CI de main fue completamente verde: "
              "https://github.com/msrobotika/AB-MakerIDE-SUPER/actions/runs/40428203094. "
              "Se incorporan dos capturas reales de Chromium y el reporte, generados en "
              f"{url}. No se ha probado firmware ScreenLab cargado en CYD/IdeaSpark, "
              "ni hardware/driver/táctil LVGL, ni se ha publicado nueva Release. "
              "R2/R3 de hardware quedan expresamente abiertos en issue #14.\n",
              encoding="utf-8",
          )
          verification = Path("specs/008-screenlab-visual-tft/verification.json")
          v = json.loads(verification.read_text(encoding="utf-8"))
          for item in v["requirements"]:
              if item["id"] == "FR-004":
                  item["notes"] = (
                      "Node y Chromium en CI main 40428203094; dos PNG auténticos "
                      "y reporte de navegador en docs/evidence/screenlab; hardware no probado."
                  )
                  item["evidence"].extend(
                      ["docs/evidence/screenlab/screenlab-cyd-real.png",
                       "docs/evidence/screenlab/screenlab-ideaspark-real.png",
                       "docs/evidence/screenlab/report.json",
                       "docs/evidence/screenlab/README.md"]
                  )
          for path in ["tests/browser_screenlab.py", "docs/evidence/screenlab/report.json"]:
              v["changed_files"][path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          verification.write_text(
              json.dumps(v, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"source_run": run, "screen_shas": hashes,
                            "checks": len(report["checks"])}))
          PY
      - name: Stage files, validate manifest and Spec Kit against main
        run: |
          git rm .github/workflows/screenlab-evidence-import-once.yml
          git add README.md docs/SCREENLAB.md docs/evidence/screenlab/ tests/browser_screenlab.py specs/008-screenlab-visual-tft/
          python tests/manifest.py --write
          git add MANIFEST_SHA256.txt
          python tests/manifest.py
          python tests/specification_gate.py --base dfb7feb278f8170b53bd2f17e198983cd4e05567 --json
          git diff --cached --stat
      - name: Commit reviewable screenshot evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(screenlab): publish proven CYD/IdeaSpark screenshots and close Spec Kit R1 evidence"
          git push origin HEAD:fix/screenlab-gallery-spec-kit-20261027
