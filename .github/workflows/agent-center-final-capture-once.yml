name: Final activity screenshots (one-time, self-removing)
on:
  push:
    branches: [feat/agent-activity-center]
    paths: ['.github/workflows/agent-center-final-capture-once.yml']
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.56.0 ruff==0.17.2
          python -m playwright install --with-deps chromium
      - name: Run real browser with controlled CLI and assert no legacy sidebar
        run: python tests/browser_agent_consent.py --outputs work/agent-center-final
      - name: Install verified screenshots and reseal Spec Kit integrity
        shell: bash
        run: |
          set -euo pipefail
          cp work/agent-center-final/agent-activity-empty-controlled.png docs/evidence/agent-activity/01-panel-sin-sesion.png
          cp work/agent-center-final/agent-activity-center-controlled.png docs/evidence/agent-activity/02-actividad-cli-controlada.png
          python -m ruff format tests/browser_agent_consent.py
          python - <<'PY'
          import pathlib,hashlib,json
          target=pathlib.Path('specs/004-agent-activity-center/verification.json')
          data=json.loads(target.read_text(encoding='utf-8'))
          for file in ('frontend/agent_activity.js','tests/browser_agent_consent.py'):
              data['changed_files'][file]=hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()
          data['changed_files']['.github/workflows/agent-center-final-capture-once.yml']='deleted'
          target.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/agent-center-final-capture-once.yml
          git add docs/evidence/agent-activity/ tests/browser_agent_consent.py specs/004-agent-activity-center/verification.json
          python tests/manifest.py --write
          git add MANIFEST_SHA256.txt
          python tests/manifest.py
      - name: Commit photos but not disposable workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(vision): clean left IA activity sidebar; add final real browser captures"
          git push origin HEAD:feat/agent-activity-center
