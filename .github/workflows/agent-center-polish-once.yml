name: Normalize agent activity Python test (one-time)
on:
  push:
    branches: [feat/agent-activity-center]
    paths: ['.github/workflows/agent-center-polish-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.2
      - run: python -m ruff format tests/browser_agent_consent.py
      - name: Rebind exact SHA-256 evidence and integrity manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          base=pathlib.Path('.')
          evidence=base/'specs/004-agent-activity-center/verification.json'
          report=json.loads(evidence.read_text(encoding='utf-8'))
          filename='tests/browser_agent_consent.py'
          report['changed_files'][filename]=hashlib.sha256((base/filename).read_bytes()).hexdigest()
          evidence.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest=base/'MANIFEST_SHA256.txt'
          old=manifest.read_text(encoding='utf-8').splitlines()
          previous={}
          for line in old[3:]:
              if '  ' in line:
                  digest,name=line.split('  ',1)
                  previous[name]=digest
          excluded={'MANIFEST_SHA256.txt','.github/workflows/agent-center-polish-once.yml'}
          tracked=[x for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x]
          for name in tracked:
              if name not in excluded:
                  previous[name]=hashlib.sha256((base/name).read_bytes()).hexdigest()
          for name in list(previous):
              if name in excluded or not (base/name).is_file():
                  del previous[name]
          manifest.write_text('\n'.join(old[:3])+'\n'+'\n'.join(
              f'{previous[name]}  {name}' for name in sorted(previous))+'\n',encoding='utf-8')
          PY
      - name: Commit source and hashes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser_agent_consent.py specs/004-agent-activity-center/verification.json MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "style(agent): Ruff-format browser test and refresh Spec Kit hashes"
            git push origin HEAD:feat/agent-activity-center
          fi
