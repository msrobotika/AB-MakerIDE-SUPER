[project]
name = "ab-makeride-super"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Local Arduino, ESP32 and MicroPython editor with optional coding agents"
license = "MIT"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".makeride-data", "node_modules", ".specify/scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
